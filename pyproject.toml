[project]
name = "modellab"
version = "0.1.0"
description = "Local-first AI security research platform for open-weight LLMs, agents, and guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.7",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "typer==0.27.3",
  "rich==15.0.0",
  "scikit-learn==1.9.1",
  "numpy==2.5.4",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
]

[project.optional-dependencies]
queue = ["dramatiq[redis]==1.17.1"]
ml = [
  "torch==2.15.0",
  "transformers==5.22.2",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "huggingface-hub==2.4.0",
  "sentence-transformers==6.2.0",
  "datasets==5.1.0",
  "peft==0.21.2",
  "trl==1.17.1",
]

[project.scripts]
modellab = "modellab_api.cli:app"

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.3", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/modellab_api",
  "packages/schemas/modellab_schemas",
  "packages/model-adapters/modellab_adapters",
  "packages/guardrails/modellab_guardrails",
  "packages/graders/modellab_graders",
  "services/inference/modellab_inference",
  "services/experiments/modellab_experiments",
  "services/evaluation/modellab_evaluation",
  "services/sandbox/modellab_sandbox",
  "services/training/modellab_training",
  "services/observability/modellab_observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: needs MODELLAB_TEST_POSTGRES_URL", "ollama: needs a running Ollama and a pulled model"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = [
  "modellab_adapters", "modellab_api", "modellab_evaluation", "modellab_experiments", "modellab_graders",
  "modellab_guardrails", "modellab_inference", "modellab_observability", "modellab_sandbox", "modellab_schemas",
  "modellab_training",
]
