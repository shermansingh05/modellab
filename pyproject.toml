[project]
name = "modellab"
version = "0.1.0"
description = "Local-first AI security research platform for open-weight LLMs, agents, and guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.6",
  "sqlalchemy==2.0.37",
  "alembic==1.14.1",
  "psycopg[binary]==3.2.4",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "typer==0.15.1",
  "rich==13.9.4",
  "scikit-learn==1.6.1",
  "numpy==2.2.2",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
]

[project.optional-dependencies]
queue = ["dramatiq[redis]==1.17.1"]
ml = [
  "torch==2.6.0",
  "transformers==4.51.3",
  "accelerate==1.3.0",
  "safetensors==0.5.2",
  "huggingface-hub==0.30.2",
  "sentence-transformers==3.4.1",
  "datasets==3.2.0",
  "peft==0.14.0",
  "trl==0.15.2",
]

[project.scripts]
modellab = "modellab_api.cli:app"

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.3", "ruff==0.9.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/modellab_api",
  "packages/schemas/modellab_schemas",
  "packages/model-adapters/modellab_adapters",
  "packages/guardrails/modellab_guardrails",
  "packages/graders/modellab_graders",
  "services/inference/modellab_inference",
  "services/experiments/modellab_experiments",
  "services/evaluation/modellab_evaluation",
  "services/sandbox/modellab_sandbox",
  "services/training/modellab_training",
  "services/observability/modellab_observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: needs MODELLAB_TEST_POSTGRES_URL", "ollama: needs a running Ollama and a pulled model"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web"]
