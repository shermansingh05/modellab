name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: modellab, POSTGRES_PASSWORD: modellab, POSTGRES_DB: modellab_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U modellab" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      # No model weights are downloaded: tests use deterministic fixtures.
      - run: uv run pytest
        env: { MODELLAB_TEST_POSTGRES_URL: "postgresql+psycopg://modellab:modellab@127.0.0.1:5432/modellab_test" }
      - run: uv run modellab demo
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
