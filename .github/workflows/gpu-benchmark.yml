# Optional and manual. Needs a self-hosted runner with Ollama and the models pulled.
name: GPU benchmark
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  benchmark:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --frozen
      - run: uv run modellab doctor
      - run: uv run modellab eval run configs/experiments/h_guardrail_layers.yaml
