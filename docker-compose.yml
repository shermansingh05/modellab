# Optional shared services. The local demo needs none of this.
name: modellab
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modellab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: modellab
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U modellab"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
